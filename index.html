<!doctype html><html lang="en"><meta charset="utf-8"><title>Launch Sky Aegis</title><style>body{margin:0;background:#092329;color:#e4efeb;font:18px/1.7 system-ui}main{max-width:630px;margin:12vh auto;padding:32px;border:1px solid #446265}h1{letter-spacing:.06em;color:#c8f3e4}code{color:#a9ebd1}</style><main><h1>SKY AEGIS</h1><p>Extract the complete archive, then open <strong>START_GAME.bat</strong> on Windows or run <strong>sh START_GAME.sh</strong> on macOS/Linux.</p><p>The launcher opens the game in your browser. Keep its window open while playing. Node.js 20 or newer is required.</p><p>If the launcher is already running, open <a style="color:#a9ebd1" href="http://127.0.0.1:4173/">Sky Aegis</a>.</p></main></html>
