name: Build and deploy Sky Aegis benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate runtime art
        run: |
          python -m pip install --disable-pip-version-check pillow numpy
          python tools/gen_assets.py
          python tools/gen_map.py
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html styles.css manifest.webmanifest service-worker.js _site/
          cp -R src assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
